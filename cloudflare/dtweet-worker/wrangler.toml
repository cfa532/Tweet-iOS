name = "dtweet-deeplink"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Custom domains: Cloudflare auto-creates the DNS records and certificates
# for the dtweet.com zone in this account.
# dl.dtweet.com is a plain zone route (its proxied DNS record points at ksbox):
# the worker only bounces https -> http there; http passes through to origin.
routes = [
  { pattern = "dtweet.com", custom_domain = true },
  { pattern = "www.dtweet.com", custom_domain = true },
  { pattern = "dl.dtweet.com/*", zone_name = "dtweet.com" },
  # Old TweetWeb links reach Leither before its client-side compatibility
  # normalizer can run. Intercept only the external share paths and redirect
  # them to the current fragment-form URL; all other legacy-host traffic keeps
  # its existing Leither routing.
  { pattern = "t1.fireshare.us/tweet/*", zone_name = "fireshare.us" },
  { pattern = "t1.fireshare.us/author/*", zone_name = "fireshare.us" }
]

[assets]
directory = "../../../TweetWeb/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
